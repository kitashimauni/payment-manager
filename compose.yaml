services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  app:
    image: payment-manager-app:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.docker}
      AUTH_MODE: ${AUTH_MODE:-auto}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_URL: ${AUTH_URL:-}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-false}
      SINGLE_USER_ID: ${SINGLE_USER_ID:-}
      TRUSTED_PROXY_TOKEN: ${TRUSTED_PROXY_TOKEN:-}
      TRUSTED_PROXY_ORIGIN: ${TRUSTED_PROXY_ORIGIN:-}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - frontend
      - backend

  migrate:
    image: payment-manager-migrate:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: migrate
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.docker}
      AUTH_MODE: ${AUTH_MODE:-auto}
      SINGLE_USER_ID: ${SINGLE_USER_ID:-}
    networks:
      - backend
    restart: "no"

volumes:
  postgres_data:

networks:
  frontend:
  backend:
    internal: true
